{% extends "base.html" %}
{% block body %}
<div class="card narrow">
  <h2>登录</h2>
  {% if error %}<p class="err">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <input type="password" name="password" placeholder="密码" autofocus required autocomplete="current-password">
    <button class="primary">登录</button>
  </form>
</div>
{% endblock %}
