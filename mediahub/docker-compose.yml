services:
  mediahub:
    build: .
    image: mediahub:latest
    container_name: mediahub
    restart: unless-stopped
    env_file: .env
    # host 网络：服务只监听 127.0.0.1:${APP_PORT}，也能直接访问宿主机上的 OpenList (127.0.0.1:5244)。
    # 外网访问由 Caddy 反向代理到 127.0.0.1:${APP_PORT}。
    network_mode: host
    environment:
      APP_HOST: 127.0.0.1
    volumes:
      - ./data:/data
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

# 如果你更想用 bridge 网络（例如 Caddy 也在 Docker 里），把上面的 network_mode 换成：
#    ports: ["127.0.0.1:8095:8095"]
#    environment: { APP_HOST: 0.0.0.0 }
#    networks: [openlist_default]   # 和 OpenList 同一个网络，OPENLIST_URL 写 http://openlist:5244
# networks:
#   openlist_default: { external: true }
